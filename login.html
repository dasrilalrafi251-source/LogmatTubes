<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kelompok 2 — Platform Layanan Publik</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/login.css">
</head>
<body>

<div class="page-header">
  <div class="logo-icon">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 3L2 9l10 6 10-6-10-6z"/>
      <path d="M2 15l10 6 10-6"/>
      <path d="M2 12l10 6 10-6"/>
    </svg>
  </div>
  <span class="brand-name">Kelompok 2</span>
</div>
<p class="page-subtitle">Project Implementasi Login Logika Matematika</p>

<div class="card">
  <h1 class="card-title">Selamat Datang Kembali</h1>

  {% if error %}
  <div class="error-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    {{ error }}
  </div>
  {% endif %}

  <form method="POST" action="/">
    <div class="field-group">
      <label class="field-label">Username / Email</label>
      <div class="input-wrapper">
        <span class="input-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </span>
        <input type="text" name="username" placeholder="Masukkan username" required autocomplete="username">
      </div>
    </div>

    <div class="field-group">
      <div class="field-label">
        <span>Kata Sandi</span>
        <a href="#" class="forgot-link">Lupa Kata Sandi?</a>
      </div>
      <div class="input-wrapper">
        <span class="input-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </span>
        <input type="password" name="password" id="pw-field" placeholder="••••••••" required autocomplete="current-password">
        <button type="button" class="toggle-pw" onclick="togglePw()" aria-label="Tampilkan kata sandi" id="pw-toggle">
          <svg id="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg id="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="register-row">
      Belum memiliki Akun? <a href="#">Daftar Disini</a>
    </div>

    <button type="submit" class="btn-login">
      Masuk
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
        <polyline points="10 17 15 12 10 7"/>
        <line x1="15" y1="12" x2="3" y2="12"/>
      </svg>
    </button>
  </form>

  <div class="info-note">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="16" x2="12" y2="12"/>
      <line x1="12" y1="8" x2="12.01" y2="8"/>
    </svg>
    <span>Akun dibuat oleh admin. Hubungi admin jika belum memiliki akses.</span>
  </div>
</div>

<script>
function togglePw() {
  var field = document.getElementById('pw-field');
  var open = document.getElementById('eye-open');
  var closed = document.getElementById('eye-closed');
  if (field.type === 'password') {
    field.type = 'text';
    open.style.display = 'none';
    closed.style.display = 'block';
  } else {
    field.type = 'password';
    open.style.display = 'block';
    closed.style.display = 'none';
  }
}
</script>
</body>
</html>
